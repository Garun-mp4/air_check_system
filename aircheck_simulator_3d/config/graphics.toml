[graphics]
window_title = "AirCheck 3D Simulator"
width = 1280
height = 800
fullscreen = false
background_rgb = [0.035, 0.055, 0.075]
text_rgb = [0.84, 0.93, 0.96]
text_scale = 0.08
ui_font_path = "C:/Windows/Fonts/arial.ttf"
quality_preset = "high"
target_fps = 60

[lighting]
ambient_rgb = [0.48, 0.56, 0.66]
sun_rgb = [0.96, 0.91, 0.79]

[quality.low]
multisample_enabled = false
multisamples = 0
shadows_enabled = false
shadow_map_size = 0
airflow_particles_per_track = 4

[quality.medium]
multisample_enabled = true
multisamples = 2
shadows_enabled = true
shadow_map_size = 512
airflow_particles_per_track = 8

[quality.high]
multisample_enabled = true
multisamples = 4
shadows_enabled = true
shadow_map_size = 1024
airflow_particles_per_track = 12
