[devices]
device_id = "room-01"

[sensors.indoor_climate]
model = "Sensirion SCD41"
zone = "indoor"
interface = "I²C"
measurements = ["co2", "temperature", "humidity"]

[sensors.indoor_particles]
model = "Sensirion SPS30"
zone = "indoor"
interface = "UART"
measurements = ["pm25"]

[sensors.outdoor_climate]
model = "Sensirion SHT45"
zone = "outdoor"
interface = "I²C"
measurements = ["temperature", "humidity"]

[sensors.outdoor_particles]
model = "Sensirion SPS30"
zone = "outdoor"
interface = "UART"
measurements = ["pm25"]

[window]
initial_position_percent = 0.0
travel_seconds = 20.0
reed_open_threshold_percent = 5.0

[ventilation]
intake_nominal_rpm = 1200.0
exhaust_nominal_rpm = 1200.0
intake_airflow_m3_h = 60.0
exhaust_airflow_m3_h = 60.0
filter_efficiency = 0.82
# Filter is active by default whenever the intake path is used.
filter_enabled = true
# Fan power values are shaft-output estimates; electrical input is power / efficiency.
intake_power_w = 5.0
exhaust_power_w = 5.0
intake_efficiency = 0.60
exhaust_efficiency = 0.60
