[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = espidf
monitor_speed = 115200
extra_scripts = pre:windows_ldgen.py
build_flags = -std=gnu++17 -DAIRCHECK_OUTPUTS_COMMISSIONED=1
board_build.partitions = partitions.csv

[env:fake]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DAIRCHECK_FAKE_SENSORS=1
