name: air-quality

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-air_quality}
      POSTGRES_USER: ${POSTGRES_USER:-air_quality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-air_quality_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-air_quality} -d $${POSTGRES_DB:-air_quality}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ml-service:
    build:
      context: ./ml-service
    environment:
      ML_PORT: ${ML_PORT:-8000}
      MODEL_PATH: /app/model/model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-1.0}
      MIN_TRAINING_ROWS: ${MIN_TRAINING_ROWS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ml-model:/app/model

  backend:
    build:
      context: ./frontend
    environment:
      PORT: ${PORT:-3000}
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-air_quality}:${POSTGRES_PASSWORD:-air_quality_dev}@postgres:5432/${POSTGRES_DB:-air_quality}
      ML_SERVICE_URL: http://ml-service:8000
      HISTORY_LIMIT: ${HISTORY_LIMIT:-5000}
      ML_HISTORY_LIMIT: ${ML_HISTORY_LIMIT:-200}
      DATA_RETENTION_HOURS: ${DATA_RETENTION_HOURS:-24}
      ML_REQUEST_TIMEOUT_MS: ${ML_REQUEST_TIMEOUT_MS:-5000}
      CO2_NORMAL_THRESHOLD: ${CO2_NORMAL_THRESHOLD:-800}
      CO2_CRITICAL_THRESHOLD: ${CO2_CRITICAL_THRESHOLD:-1000}
      PM25_GOOD_LIMIT: ${PM25_GOOD_LIMIT:-15}
      PM25_ELEVATED_LIMIT: ${PM25_ELEVATED_LIMIT:-35}
      DEVICE_ID: ${DEVICE_ID:-room-01}
      DEVICE_API_TOKEN: ${DEVICE_API_TOKEN:-}
      DEVICE_HEARTBEAT_TIMEOUT_MS: ${DEVICE_HEARTBEAT_TIMEOUT_MS:-90000}
      SIMULATOR_INTERNAL_URL: http://web-simulator:8090
      SIMULATOR_INTERNAL_TOKEN: ${SIMULATOR_INTERNAL_TOKEN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://${AIR_CHECK_DOMAIN:-aircheck.home.arpa}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://${AIR_CHECK_DOMAIN:-aircheck.home.arpa},http://localhost:${PORT:-3000},http://127.0.0.1:${PORT:-3000}}
      WINDOW_MANUAL_OVERRIDE_MINUTES: ${WINDOW_MANUAL_OVERRIDE_MINUTES:-30}
      AUTO_VENTILATION_MINIMUM_MINUTES: ${AUTO_VENTILATION_MINIMUM_MINUTES:-5}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTO_WINDOW_ENABLED: ${AUTO_WINDOW_ENABLED:-true}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  simulator:
    build:
      context: ./sensor-simulator
    environment:
      BACKEND_URL: http://backend:3000
      DEVICE_ID: ${DEVICE_ID:-room-01}
      DEVICE_API_TOKEN: ${DEVICE_API_TOKEN:-}
      SIMULATOR_LOCK_DIRECTORY: /var/run/aircheck-simulator
      SIMULATOR_MODE: ${SIMULATOR_MODE:-live}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-30}
      SCENARIO: ${SCENARIO:-normal}
      INITIAL_CO2: ${INITIAL_CO2:-650}
      BASE_TEMPERATURE: ${BASE_TEMPERATURE:-23}
      BASE_HUMIDITY: ${BASE_HUMIDITY:-45}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-4}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-1}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-5}
      BACKFILL_POINTS: ${BACKFILL_POINTS:-480}
      BACKFILL_INTERVAL_SECONDS: ${BACKFILL_INTERVAL_SECONDS:-30}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - simulator-lock:/var/run/aircheck-simulator
    profiles:
      - demo

  web-simulator:
    build:
      context: .
      dockerfile: aircheck_simulator_3d/Dockerfile.headless
    environment:
      BACKEND_URL: http://backend:3000
      DASHBOARD_URL: ${AIR_CHECK_PUBLIC_URL:-https://${AIR_CHECK_DOMAIN:-aircheck.home.arpa}}
      DEVICE_ID: ${DEVICE_ID:-room-01}
      DEVICE_API_TOKEN: ${DEVICE_API_TOKEN:-}
      SIMULATOR_INTERNAL_TOKEN: ${SIMULATOR_INTERNAL_TOKEN:-}
      SIMULATOR_LOCK_DIRECTORY: /var/run/aircheck-simulator
      LOG_LEVEL: ${SIMULATOR_LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_started
    volumes:
      - simulator-lock:/var/run/aircheck-simulator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - web-demo

  owner-cli:
    build:
      context: ./frontend
      target: owner-tools
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-air_quality}:${POSTGRES_PASSWORD:-air_quality_dev}@postgres:5432/${POSTGRES_DB:-air_quality}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - maintenance

  https-proxy:
    image: caddy:2-alpine
    environment:
      AIR_CHECK_DOMAIN: ${AIR_CHECK_DOMAIN:-aircheck.home.arpa}
      PORT: ${PORT:-3000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  postgres-data:
  ml-model:
  caddy-data:
  caddy-config:
  simulator-lock:
