name: Browser integration
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: frontend
      - run: pip install -r ml-service/requirements.txt -r aircheck_simulator_3d/requirements-headless.txt
      - run: pip install pytest==8.4.2
      - run: python scripts/export_stand_reference.py --check
      - run: python -m pytest aircheck_simulator_3d/tests sensor-simulator ml-service/tests tests/database tests/infrastructure -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: python -m pytest tests/integration/test_compose_e2e.py -q
        env:
          AIRCHECK_RUN_COMPOSE_E2E: '1'
      - run: python tests/browser/run.py
      - run: python tests/browser/run.py
        env:
          AIRCHECK_BROWSER_MODE: real
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: tests/browser/artifacts/
          retention-days: 3
