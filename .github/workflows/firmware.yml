name: Single ESP32 firmware
on:
  push:
    paths: ['firmware/**', 'config/hardware.json', 'tests/firmware/**', 'tests/infrastructure/test_hardware_contract.py', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'config/hardware.json', 'tests/firmware/**', 'tests/infrastructure/test_hardware_contract.py', '.github/workflows/firmware.yml']
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: esp32-idf-6.1-pio-7.1.3-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini', 'firmware/esp32/src/idf_component.yml') }}
      - run: python -m pip install -r firmware/requirements-build.txt
      - run: python firmware/esp32/generate_board.py --check
      - run: python firmware/esp32/build.py --env esp32
      - run: python firmware/esp32/build.py --env fake
      - name: Native safety and NVS integration tests
        env:
          AIRCHECK_IDF_PATH: /home/runner/.platformio/packages/framework-espidf
        run: python -m pytest tests/firmware tests/infrastructure/test_hardware_contract.py -q
